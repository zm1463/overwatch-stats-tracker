<!doctype html>
<html>

<head>
  <title> OverStat Comparer </title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
<header class="header"> 
  <h1> Overwatch Stat Comparison Site </h1> 
</header>

<nav class="nav">
  <h2> Various links will be here </h2>
</nav>

<main>

  <div class="player-card" id="player-one">
    
    <form class="battletag-input-form">
      <label for="player-one-battletag-search">Enter First Battletag:</label>
      <input class="input-box" type="text" id="player-one-battletag-search" placeholder="e.g., FrostyFeet#1111">
      <button class="compare-button" type="submit">Compare</button>
    </form>

    <h2 style="margin-top: 1%;">Player 1 Placeholder Name</h2>
    <ul id="player-one-list">
      <li>A humble filler</li>
    </ul>
  </div>

  <div class="player-card" id ="player-two">

    <form class="battletag-input-form">
      <label for="player-two-battletag-search">Enter Second  Battletag:</label>
      <input class="input-box" type="text" id="player-two-battletag-search" placeholder="e.g., FrostyFeet#2222">
      <button class="compare-button" type="submit">Compare</button>
    </form>

    <h2 style="margin-top: 1%;">Player 2 Placeholder Name</h2>
    <ul id="player-two-list">
      <li>A second humble filler</li>
      <li> BAZINGA</li>
    </ul>
 </div>

</main>

</body>
</html>
